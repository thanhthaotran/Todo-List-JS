<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Todo-List-Js</title>

<style>
    body{
        background:pink;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .box{
        background:white;
        padding:20px;
        width:350px;
        border-radius:12px;
        box-shadow: 0 16px 18px rgb(0,0,0,0.2);
    }

    .khungcv{
        width:75%;
        padding:10px;
        border-radius: 10px;
        border: 1px solid grey;
    }


    /*remove*/
    button.remove{
        padding:10px;
        cursor:pointer;
        border-radius: 10px;
        border:none;
        background-color: white;
    }

    button.remove:hover{
        /*Tạo hiệu ứng bóng đổ*/
        transform: translateY(-5px);
        box-shadow: 0 8px black;
    }

    .khungds{
        display:flex;
        justify-content:space-between;
        margin-top:10px;
        background:pink;
        padding:8px;
        border-radius:8px;
    }

    .box_2{
        display:flex;
        gap:10px
    }

    /*clearAll*/
    button.clearAll{
        padding:10px;
        cursor:pointer;
        border-radius: 10px;
        border:none;
        background-color: pink;
        margin-top:10px;
        margin-left:170px
    }

    button.clearAll:hover{
        /*Tạo hiệu ứng bóng đổ*/
        transform: translateY(-5px);
        box-shadow: 0 8px black;
    }

    /*add*/
    button.add{
        padding:10px;
        cursor:pointer;
        border-radius: 10px;
        border:none;
        background-color: pink;
        width:50px;
        margin-left:10px
    }

    button.add:hover{
        /*Tạo hiệu ứng bóng đổ*/
        transform: translateY(-5px);
        box-shadow: 0 8px black;
    }

    /*Tieude*/
    .tieude{
        text-align: center;
        font-size: 30px;
    }
</style>
</head>

<body>

<div class="box">
    <h2 class="tieude">Todo_List</h2>

    <input id="cv" class="khungcv" placeholder="Nhập công việc">
    <button class="add" onclick="add()">+</button>

    <div id="list"></div>

    <div class="box_2">
        <p>Số công việc: <span id="count">0</span></p>

        <button class="clearAll" onclick="clearAll()">Clear All</button>
    </div>
</div>

<script>
    // ================= TẠO MẢNG DATA ĐỂ CHỨA DL =================
    let data = JSON.parse(localStorage.getItem("todo")) || [];

    // ================= HÀM LƯU DL (KHÔNG XÓA KHI RELOAD TRANG) =================
    function save(){
        localStorage.setItem("todo", JSON.stringify(data));
    }

    // ================= HÀM XÓA DL =================
    function render(){
        let list = document.getElementById("list");
        let count = document.getElementById("count");
        list.innerHTML = "";
        data.forEach((khungds, i) => {
            list.innerHTML += `
                <div class="khungds">
                    <span>${khungds}</span>
                    <button class="remove" onclick="remove(${i})">🗑️</button>
                </div>
            `;
        });
        count.innerText = data.length;
        list.style.display = data.length ? "block" : "none";
    }

    // ================= HÀM THÊM DL =================
    function add(){
        let cv = document.getElementById("cv");
        if(!cv.value.trim()){
            alert("Nhập công việc!");
            return;
        }
        data.push(cv.value);
        cv.value = "";

        save();
        render();
    }

    // ================= HÀM XÓA 01 CV TRONG KHUNGDS =================
   function remove(i){
        if(confirm("Chắc chắn muốn xóa công việc này không?")){
            data.splice(i, 1);
            save();
            render();
        }
    }

    // ================= HÀM XÓA TOÀN BỘ DL =================
    function clearAll(){
        if(confirm("Xóa hết công việc?")){
            data = [];
            save();
            render();
        }
    }
    render();
</script>
</body>
</html>
